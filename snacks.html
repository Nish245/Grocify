<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snacks Catalogue</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <script>
        function addToCart(item) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(item);
            localStorage.setItem('cart', JSON.stringify(cart));
        }
    </script>
</head>
<body>
    <div class="container">
        <h2 class="center-align">Snacks Catalogue</h2>
        <div class="row">
            <!-- Example Product 1: Chips -->
            <div class="col s12 m4">
                <div class="card">
                    <div class="card-image">
                        <img src="C:\Users\ABHIJEET\Downloads\chips.jpg" alt="Chips">
                    </div>
                    <div class="card-content">
                        <span class="card-title">Chips</span>
                        <p>Crunchy and tasty chips</p>
                    </div>
                    <div class="card-action">
                        <a href="#" class="btn" onclick="addToCart('Chips')">Add to Cart</a>
                    </div>
                </div>
            </div>
            <!-- Example Product 2: Biscuits -->
            <div class="col s12 m4">
                <div class="card">
                    <div class="card-image">
                        <img src="C:\Users\ABHIJEET\Downloads\biscuits.jpg" alt="Biscuits">
                    </div>
                    <div class="card-content">
                        <span class="card-title">Biscuits</span>
                        <p>Delicious and crunchy biscuits</p>
                    </div>
                    <div class="card-action">
                        <a href="#" class="btn" onclick="addToCart('Biscuits')">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="center-align">
            <a href="cart.html" class="btn">Go to Cart</a>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
