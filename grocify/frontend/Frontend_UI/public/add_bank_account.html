    <div class="container">
        <h4>Add Bank Account</h4>
        <form id="bankAccountForm">
            <div class="input-field">
                <input id="accountHolderName" type="text" placeholder="Account Holder Name" required>
                <label for="accountHolderName">Account Holder Name</label>
            </div>
            <div class="input-field">
                <input id="bsb" type="text" placeholder="BSB (6 Digits)" maxlength="6" required>
                <label for="bsb">BSB</label>
            </div>
            <div class="input-field">
                <input id="accountNumber" type="text" placeholder="Account Number" maxlength="10" required>
                <label for="accountNumber">Account Number</label>
            </div>
            <div class="input-field">
                <input id="bankName" type="text" placeholder="Bank Name" readonly>
                <label for="bankName">Bank Name</label>
            </div>
            <label>
                <input type="checkbox" id="defaultBank">
                <span>Set as Default Bank Account</span>
            </label>
            <br><br>
            <button type="submit" class="btn waves-effect waves-light">Add Bank Account</button>
        </form>
    </div>

    <footer>
        <div>
