<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Grocify</title>
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="purple darken-2">
            <div class="nav-wrapper container">
                <a href="home.html" class="brand-logo">
                    <img src="C:\Users\ABHIJEET\Downloads\Grocifylogo.png" alt="Grocify Logo" style="vertical-align: middle; height: 80px; margin-right: 16px;">Grocify</a>
                <ul id="nav-mobile" class="right hide-on-med-and-down">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="cart.html">Cart</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="card-panel">
                <h4 class="center-align">Checkout</h4>
                <form id="checkout-form">
                    <div class="input-field">
                        <input type="text" id="name" required>
                        <label for="name">Name</label>
                    </div>

                    <div class="input-field">
                        <input type="text" id="address" required>
                        <label for="address">Address</label>
                    </div>

                    <div class="input-field">
                        <input type="text" id="card" maxlength="16" pattern="\d{16}" required>
                        <label for="card">Credit Card</label>
                    </div>

                    <div class="row">
                        <div class="input-field col s6">
                            <select id="expiry-month" required>
                                <option value="" disabled selected>Select month</option>
                                <option value="01">January</option>
                                <option value="02">February</option>
                                <option value="03">March</option>
                                <option value="04">April</option>
                                <option value="05">May</option>
                                <option value="06">June</option>
                                <option value="07">July</option>
                                <option value="08">August</option>
                                <option value="09">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                            <label for="expiry-month">Expiry Month</label>
                        </div>
                        <div class="input-field col s6">
                            <select id="expiry-year" required>
                                <option value="" disabled selected>Select year</option>
                                <script>
                                    const currentYear = new Date().getFullYear();
                                    const expiryYearSelect = document.getElementById('expiry-year');
                                    for (let i = 0; i < 10; i++) {
                                        const yearOption = document.createElement('option');
                                        yearOption.value = currentYear + i;
                                        yearOption.textContent = currentYear + i;
                                        expiryYearSelect.appendChild(yearOption);
                                    }
                                </script>
                            </select>
                            <label for="expiry-year">Expiry Year</label>
                        </div>
                    </div>

                    <div class="input-field">
                        <input type="text" id="cvv" maxlength="3" pattern="\d{3}" required>
                        <label for="cvv">CVV</label>
                    </div>

                    <div class="center-align">
                        <button type="submit" class="btn purple darken-2 waves-effect waves-light">Place Order</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('select');
            var instances = M.FormSelect.init(elems);
        });
    </script>
</body>
</html>
