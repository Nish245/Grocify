<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Catalogue</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <script>
        function addToCart(item) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(item);
            localStorage.setItem('cart', JSON.stringify(cart));
        }
    </script>
</head>
<body>
    <div class="container">
        <h2 class="center-align">Milk Catalogue</h2>
        <div class="row">
            <!-- Example Product 1: Cow Milk -->
            <div class="col s12 m4">
                <div class="card">
                    <div class="card-image">
                        <img src="C:\Users\ABHIJEET\Downloads\cow_milk.jpg" alt="Cow Milk">
                    </div>
                    <div class="card-content">
                        <span class="card-title">Cow Milk</span>
                        <p>Fresh and healthy cow milk</p>
                    </div>
                    <div class="card-action">
                        <a href="#" class="btn" onclick="addToCart('Cow Milk')">Add to Cart</a>
                    </div>
                </div>
            </div>
            <!-- Example Product 2: Almond Milk -->
            <div class="col s12 m4">
                <div class="card">
                    <div class="card-image">
                        <img src="C:\Users\ABHIJEET\Downloads\almond_milk.jpg" alt="Almond Milk">
                    </div>
                    <div class="card-content">
                        <span class="card-title">Almond Milk</span>
                        <p>Fresh and creamy almond milk</p>
                    </div>
                    <div class="card-action">
                        <a href="#" class="btn" onclick="addToCart('Almond Milk')">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="center-align">
            <a href="cart.html" class="btn">Go to Cart</a>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
