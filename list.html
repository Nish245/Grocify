<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <style>
        /* Custom styling */
        .list-section {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="purple darken-2">
        <div class="nav-wrapper container">
            <a href="home.html" class="brand-logo">
                <img src="C:\Users\ABHIJEET\Downloads\Grocifylogo.png" alt="Grocify Logo" style="vertical-align: middle; height: 80px; margin-right: 16px;">Grocify
            </a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="home.html">Home</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container list-section">
        <h2 class="center-align">Create Your List</h2>
        <div class="row">
            <div class="col s12 m6 offset-m3">
                <input type="text" id="list-item" placeholder="Add an item" class="validate">
                <button class="btn blue darken-4 waves-effect waves-light" id="add-item">Add Item</button>
                <ul id="list" class="collection"></ul>
            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // JavaScript to handle list item addition
        document.getElementById('add-item').addEventListener('click', function() {
            const listItem = document.getElementById('list-item').value.trim();

            if (listItem) {
                const li = document.createElement('li');
                li.classList.add('collection-item');
                li.textContent = listItem;

                // Create delete button for the item
                const deleteButton = document.createElement('a');
                deleteButton.classList.add('secondary-content', 'waves-effect', 'waves-light', 'btn-small', 'red');
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', function() {
                    li.remove(); // Remove the item from the list
                });

                li.appendChild(deleteButton);
                document.getElementById('list').appendChild(li);

                // Clear the input field
                document.getElementById('list-item').value = '';
            } else {
                M.toast({ html: 'Please enter an item to add!' });
            }
        });
    </script>
</body>
</html>
